<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Praveen's Monster Math & English Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0a23 0%, #1a1a40 100%);
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }
    
    /* Background elements */
    .bg-monster {
      position: fixed;
      font-size: 8rem;
      opacity: 0.05;
      z-index: -1;
      animation: float 15s infinite ease-in-out;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    
    header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 3px solid #0ff;
      margin-bottom: 30px;
      box-shadow: 0 5px 15px rgba(0, 255, 255, 0.2);
      border-radius: 0 0 20px 20px;
      background: rgba(10, 10, 35, 0.8);
    }
    
    h1 {
      font-size: 3rem;
      color: #0ff;
      text-shadow: 0 0 15px #0ff, 0 0 25px #0ff;
      margin: 10px 0;
      letter-spacing: 1px;
    }
    
    .subtitle {
      font-size: 1.2rem;
      color: #ff0;
      margin: 5px 0;
      text-shadow: 0 0 10px #ff0;
    }
    
    .player-name {
      color: #ff9900;
      font-weight: bold;
      font-size: 1.3rem;
      animation: glow 2s infinite alternate;
    }
    
    @keyframes glow {
      from { text-shadow: 0 0 5px #ff9900; }
      to { text-shadow: 0 0 15px #ff9900, 0 0 20px #ff9900; }
    }
    
    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: rgba(0, 0, 30, 0.8);
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 30px;
      border: 2px solid #0ff;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    }
    
    .stat {
      text-align: center;
      flex: 1;
    }
    
    .stat-value {
      font-size: 2rem;
      color: #0ff;
      text-shadow: 0 0 10px #0ff;
      font-weight: bold;
    }
    
    .stat-label {
      font-size: 0.9rem;
      color: #aaa;
      margin-top: 5px;
    }
    
    .subject-indicator {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      margin-left: 10px;
      font-weight: bold;
      animation: subjectChange 0.5s;
    }
    
    @keyframes subjectChange {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .math-subject {
      background: #0ff;
      color: #000;
    }
    
    .english-subject {
      background: #ff0;
      color: #000;
    }
    
    .game-mode {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .mode-btn {
      padding: 12px 25px;
      background: #111;
      border: 2px solid #0ff;
      color: #0ff;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .mode-btn.active {
      background: #0ff;
      color: #000;
      box-shadow: 0 0 20px #0ff;
    }
    
    .mode-btn:hover:not(.active) {
      box-shadow: 0 0 15px #0ff;
    }
    
    .level-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 15px;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
      background: rgba(0, 0, 20, 0.7);
      border-radius: 20px;
      border: 2px solid #0ff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }
    
    .level-btn {
      background: #111;
      border: 2px solid #0ff;
      color: #0ff;
      border-radius: 10px;
      font-size: 1.5rem;
      text-align: center;
      padding: 20px 5px;
      cursor: pointer;
      text-shadow: 0 0 5px #0ff;
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }
    
    .level-btn.completed {
      background: #00cc00;
      border-color: #00ff00;
      color: #fff;
      text-shadow: 0 0 5px #fff;
    }
    
    .level-btn.locked {
      background: #222;
      border: 2px solid #555;
      color: #555;
      cursor: not-allowed;
    }
    
    .level-btn.current {
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 5px #0ff; }
      50% { box-shadow: 0 0 20px #0ff; }
      100% { box-shadow: 0 0 5px #0ff; }
    }
    
    .level-btn:hover:not(.locked) {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 255, 255, 0.5);
    }
    
    .level-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 0.7rem;
      background: #ff0;
      color: #000;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .game-area {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
      background: rgba(0, 0, 30, 0.8);
      padding: 30px;
      border-radius: 20px;
      border: 2px solid #0ff;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
      max-width: 800px;
      margin: 30px auto;
    }
    
    .question-box {
      background: rgba(0, 20, 40, 0.8);
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 30px;
      border: 2px solid #ff0;
      width: 100%;
      text-align: center;
    }
    
    .question {
      font-size: 2.2rem;
      color: #fff;
      text-shadow: 0 0 10px #fff;
      margin-bottom: 10px;
    }
    
    .question-subtitle {
      font-size: 1rem;
      color: #aaa;
      margin-top: 10px;
    }
    
    .hint {
      background: rgba(255, 255, 0, 0.1);
      padding: 10px;
      border-radius: 10px;
      margin-top: 15px;
      border-left: 4px solid #ff0;
      text-align: left;
      font-size: 0.9rem;
      color: #ff0;
    }
    
    .answers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      width: 100%;
      margin-bottom: 30px;
    }
    
    .answer-btn {
      padding: 18px 25px;
      font-size: 1.5rem;
      border: none;
      border-radius: 15px;
      background: linear-gradient(145deg, #111, #222);
      color: white;
      cursor: pointer;
      text-shadow: 0 0 5px white;
      border: 2px solid #0ff;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    
    .answer-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 255, 255, 0.5);
    }
    
    .answer-btn.correct {
      background: linear-gradient(145deg, #006600, #00aa00);
      border-color: #00ff00;
      box-shadow: 0 0 25px #00ff00;
    }
    
    .answer-btn.wrong {
      background: linear-gradient(145deg, #660000, #aa0000);
      border-color: #ff0000;
      box-shadow: 0 0 25px #ff0000;
    }
    
    .controls {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    
    .next-btn {
      padding: 15px 40px;
      font-size: 1.5rem;
      background: linear-gradient(145deg, #00cc00, #00ff00);
      color: #000;
      border: none;
      border-radius: 15px;
      text-shadow: 0 0 5px #000;
      box-shadow: 0 0 20px #0f0;
      cursor: pointer;
      display: none;
      animation: dropDown 0.4s ease;
      font-weight: bold;
      transition: all 0.3s;
    }
    
    .next-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px #0f0;
    }
    
    .hint-btn {
      padding: 15px 30px;
      font-size: 1.2rem;
      background: linear-gradient(145deg, #ff9900, #ffcc00);
      color: #000;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }
    
    .hint-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #ff9900;
    }
    
    .progress-container {
      width: 100%;
      background: #111;
      height: 20px;
      border-radius: 10px;
      margin: 20px 0;
      overflow: hidden;
      border: 1px solid #0ff;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #0ff, #0af);
      border-radius: 10px;
      transition: width 0.5s ease;
    }
    
    .completion-screen {
      display: none;
      text-align: center;
      padding: 40px;
      background: rgba(0, 20, 40, 0.9);
      border-radius: 20px;
      border: 3px solid #ff0;
      box-shadow: 0 0 40px #ff0;
      max-width: 600px;
      margin: 50px auto;
    }
    
    .trophy {
      font-size: 5rem;
      color: #ffcc00;
      margin-bottom: 20px;
      animation: spin 3s infinite linear;
    }
    
    @keyframes spin {
      0% { transform: rotateY(0); }
      100% { transform: rotateY(360deg); }
    }
    
    .celebration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      display: none;
    }
    
    @media screen and (max-width: 768px) {
      h1 { font-size: 2rem; }
      .level-container { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
      .level-btn { padding: 15px 5px; font-size: 1.2rem; }
      .answers { grid-template-columns: 1fr; }
      .answer-btn { font-size: 1.2rem; padding: 15px; }
      .question { font-size: 1.8rem; }
      .stats-bar { flex-direction: column; gap: 15px; }
      .controls { flex-direction: column; }
    }
  </style>
</head>
<body>
  <!-- Background monsters -->
  <div class="bg-monster" style="top:10%; left:5%;">👾</div>
  <div class="bg-monster" style="top:20%; right:10%;">🧮</div>
  <div class="bg-monster" style="bottom:15%; left:15%;">📚</div>
  <div class="bg-monster" style="bottom:25%; right:20%;">🔤</div>
  
  <div class="container">
    <header>
      <h1>👾 Monster Math & English Game</h1>
      <div class="subtitle">Designed especially for <span class="player-name">YASH</span></div>
      <div class="subtitle">Challenge your brain with 100+ levels!</div>
    </header>
    
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="score">0</div>
        <div class="stat-label">SCORE</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="levelDisplay">1</div>
        <div class="stat-label">CURRENT LEVEL</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="lives">3</div>
        <div class="stat-label">LIVES</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="streak">0</div>
        <div class="stat-label">STREAK</div>
      </div>
    </div>
    
    <div class="game-mode">
      <button class="mode-btn active" id="modeMath">🧮 Math Only</button>
      <button class="mode-btn" id="modeEnglish">🔤 English Only</button>
      <button class="mode-btn" id="modeMixed">🎯 Mixed Challenge</button>
    </div>
    
    <div class="level-container" id="levelContainer">
      <!-- Levels will be injected by JS -->
    </div>
    
    <div class="game-area" id="gameArea">
      <div class="question-box">
        <div class="question" id="question"></div>
        <div class="question-subtitle" id="questionSubtitle"></div>
        <div class="hint" id="hint" style="display:none;"></div>
      </div>
      
      <div class="progress-container">
        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
      </div>
      
      <div class="answers" id="answers"></div>
      
      <div class="controls">
        <button class="hint-btn" id="hintBtn">💡 Show Hint (3 left)</button>
        <button class="next-btn" id="nextBtn">Next Level →</button>
      </div>
    </div>
    
    <div class="completion-screen" id="completionScreen">
      <div class="trophy">🏆</div>
      <h2 style="color:#ffcc00;">CONGRATULATIONS PRAVEEN!</h2>
      <p style="font-size:1.5rem; color:#0ff;">You've completed all 100 levels!</p>
      <p style="font-size:1.2rem;">Final Score: <span id="finalScore" style="color:#ff0; font-size:2rem;">0</span></p>
      <p>You're a true Math & English Champion!</p>
      <button class="next-btn" onclick="location.reload()" style="margin-top:30px;">Play Again</button>
    </div>
  </div>
  
  <!-- Celebration effect -->
  <div class="celebration" id="celebration"></div>
  
  <!-- Sounds -->
  <audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/201/201-preview.mp3"></audio>
  <audio id="wrongSound" src="https://assets.mixkit.co/active_storage/sfx/255/255-preview.mp3"></audio>
  <audio id="levelUpSound" src="https://assets.mixkit.co/active_storage/sfx/257/257-preview.mp3"></audio>
  <audio id="celebrationSound" src="https://assets.mixkit.co/active_storage/sfx/265/265-preview.mp3"></audio>

  <script>
    // Game Configuration
    const TOTAL_LEVELS = 100;
    const HARD_LEVEL_START = 50;
    let currentLevel = 0;
    let unlockedLevels = 1;
    let score = 0;
    let lives = 3;
    let streak = 0;
    let gameMode = 'math'; // 'math', 'english', 'mixed'
    let hintsLeft = 3;
    
    // DOM Elements
    const levelContainer = document.getElementById("levelContainer");
    const gameArea = document.getElementById("gameArea");
    const questionEl = document.getElementById("question");
    const questionSubtitle = document.getElementById("questionSubtitle");
    const answersEl = document.getElementById("answers");
    const nextBtn = document.getElementById("nextBtn");
    const progressBar = document.getElementById("progressBar");
    const scoreEl = document.getElementById("score");
    const levelDisplay = document.getElementById("levelDisplay");
    const livesEl = document.getElementById("lives");
    const streakEl = document.getElementById("streak");
    const hintEl = document.getElementById("hint");
    const hintBtn = document.getElementById("hintBtn");
    const completionScreen = document.getElementById("completionScreen");
    const celebration = document.getElementById("celebration");
    const finalScore = document.getElementById("finalScore");
    
    // Sounds
    const winSound = document.getElementById("winSound");
    const wrongSound = document.getElementById("wrongSound");
    const levelUpSound = document.getElementById("levelUpSound");
    const celebrationSound = document.getElementById("celebrationSound");
    
    // Game Modes
    document.getElementById("modeMath").addEventListener("click", () => setGameMode('math'));
    document.getElementById("modeEnglish").addEventListener("click", () => setGameMode('english'));
    document.getElementById("modeMixed").addEventListener("click", () => setGameMode('mixed'));
    
    function setGameMode(mode) {
      gameMode = mode;
      document.querySelectorAll(".mode-btn").forEach(btn => btn.classList.remove("active"));
      document.getElementById(`mode${mode.charAt(0).toUpperCase() + mode.slice(1)}`).classList.add("active");
      
      // Reset and show levels
      gameArea.style.display = "none";
      levelContainer.style.display = "grid";
      createLevels();
    }
    
    // Question Database - Now with 100 levels including hard questions and English
    const mathQuestions = [
      // Easy levels 1-30
      { q: "5 + 2 = ?", options: [3, 7, 9], correct: 7, hint: "Add 5 and 2 together", level: 1 },
      { q: "9 - 3 = ?", options: [6, 8, 4], correct: 6, hint: "Subtract 3 from 9", level: 1 },
      { q: "2 × 4 = ?", options: [6, 8, 10], correct: 8, hint: "2 multiplied by 4", level: 2 },
      { q: "15 ÷ 3 = ?", options: [3, 5, 6], correct: 5, hint: "Divide 15 by 3", level: 2 },
      { q: "7 + 8 = ?", options: [13, 14, 15], correct: 15, hint: "Add 7 and 8", level: 3 },
      { q: "12 - 5 = ?", options: [6, 7, 8], correct: 7, hint: "Subtract 5 from 12", level: 3 },
      { q: "3 × 5 = ?", options: [10, 15, 20], correct: 15, hint: "3 multiplied by 5", level: 4 },

      { q: "30 - 12 = ?", options: [16, 17, 18], correct: 18, hint: "Subtract 12 from 30", level: 5 },
      
      // Medium levels 31-60
      { q: "7 × 8 = ?", options: [48, 54, 56], correct: 56, hint: "7 multiplied by 8", level: 6 },
      { q: "72 ÷ 9 = ?", options: [7, 8, 9], correct: 8, hint: "Divide 72 by 9", level: 6 },
      { q: "15 × 3 = ?", options: [35, 40, 45], correct: 45, hint: "15 multiplied by 3", level: 7 },
      { q: "64 ÷ 8 = ?", options: [7, 8, 9], correct: 8, hint: "Divide 64 by 8", level: 7 },
      { q: "125 + 234 = ?", options: [349, 359, 369], correct: 359, hint: "Add 125 and 234", level: 8 },
      { q: "500 - 276 = ?", options: [214, 224, 234], correct: 224, hint: "Subtract 276 from 500", level: 8 },
      { q: "12 × 11 = ?", options: [121, 132, 143], correct: 132, hint: "12 multiplied by 11", level: 9 },
      { q: "144 ÷ 12 = ?", options: [10, 11, 12], correct: 12, hint: "Divide 144 by 12", level: 9 },
      { q: "345 + 267 = ?", options: [602, 612, 622], correct: 612, hint: "Add 345 and 267", level: 10 },
      { q: "800 - 425 = ?", options: [365, 375, 385], correct: 375, hint: "Subtract 425 from 800", level: 10 },
      
      // Hard levels 61-100
      { q: "15² = ?", options: [200, 225, 250], correct: 225, hint: "15 squared (15 × 15)", level: 11 },
      { q: "√144 = ?", options: [10, 12, 14], correct: 12, hint: "Square root of 144", level: 11 },
      { q: "7! = ?", options: [5040, 720, 40320], correct: 5040, hint: "7 factorial (7×6×5×4×3×2×1)", level: 12 },
      { q: "3³ + 4² = ?", options: [35, 43, 51], correct: 43, hint: "3 cubed plus 4 squared", level: 12 },
      { q: "If x+5=12, x = ?", options: [5, 7, 9], correct: 7, hint: "Subtract 5 from both sides", level: 13 },
      { q: "2⁵ = ?", options: [16, 32, 64], correct: 32, hint: "2 to the power of 5", level: 13 },
      { q: "log₁₀100 = ?", options: [1, 2, 10], correct: 2, hint: "Logarithm base 10 of 100", level: 14 },
      { q: "sin(90°) = ?", options: [0, 0.5, 1], correct: 1, hint: "Sine of 90 degrees", level: 14 },
      { q: "π (to 2 decimals) = ?", options: [3.14, 3.16, 3.18], correct: 3.14, hint: "Pi is approximately 3.14", level: 15 },
      { q: "e (to 2 decimals) = ?", options: [2.71, 2.81, 2.91], correct: 2.71, hint: "Euler's number is approximately 2.71", level: 15 },

    const englishQuestions = [
      // Grammar
      { q: "Choose the correct sentence:", options: ["He go to school", "He goes to school", "He going to school"], correct: "He goes to school", hint: "Third person singular needs 's'", level: 1 },

      // Advanced
      { q: "Correct: The team ___ playing well.", options: ["is", "are", "were"], correct: "is", hint: "Team as a single unit", level: 11 },
      { q: "Which is a palindrome?", options: ["level", "hello", "world"], correct: "level", hint: "Reads same forwards/backwards", level: 11 },

      { q: "Literary device in 'The stars danced':", options: ["simile", "personification", "metaphor"], correct: "personification", hint: "Giving human traits to non-human", level: 12 },
      { q: "Shakespeare's famous tragedy:", options: ["Hamlet", "Twelfth Night", "The Tempest"], correct: "Hamlet", hint: "To be or not to be", level: 13 },
      { q: "Homophone for 'their':", options: ["there", "they're", "both"], correct: "both", hint: "Same sound, different meaning", level: 13 },
      { q: "Opposite of 'prologue':", options: ["epilogue", "dialogue", "monologue"], correct: "epilogue", hint: "End section of a book", level: 14 },
      { q: "A group of crows:", options: ["flock", "murder", "herd"], correct: "murder", hint: "Collective noun for crows", level: 14 },
      { q: "Language with most words:", options: ["Chinese", "English", "Arabic"], correct: "English", hint: "Over 1 million words", level: 15 },
      { q: "Oldest English epic poem:", options: ["Beowulf", "Canterbury Tales", "Paradise Lost"], correct: "Beowulf", hint: "Anglo-Saxon epic", level: 15 },
    ];
    
    // Initialize the game
    function initGame() {
      updateStats();
      createLevels();
    }
    
    // Create level buttons
    function createLevels() {
      levelContainer.innerHTML = '';
      for (let i = 0; i < TOTAL_LEVELS; i++) {
        const btn = document.createElement('div');
        btn.className = 'level-btn';
        
        // Determine level status
        if (i < unlockedLevels) {
          btn.innerText = i + 1;
          if (i < currentLevel) {
            btn.classList.add('completed');
          } else if (i === currentLevel) {
            btn.classList.add('current');
          }
        } else {
          btn.innerText = `${i + 1} 🔒`;
          btn.classList.add('locked');
        }
        
        // Add subject badge for mixed mode
        if (gameMode === 'mixed' && i < unlockedLevels) {
          const badge = document.createElement('div');
          badge.className = 'level-badge';
          badge.innerText = getSubjectForLevel(i) === 'math' ? 'M' : 'E';
          btn.appendChild(badge);
        }
        
        btn.addEventListener('click', () => {
          if (unlockedLevels > i) startLevel(i);
        });
        levelContainer.appendChild(btn);
      }
    }
    
    // Get subject for a specific level (for mixed mode)
    function getSubjectForLevel(level) {
      // Alternate between math and english, with some randomness
      if (level < 30) return level % 2 === 0 ? 'math' : 'english';
      if (level < 70) return level % 3 === 0 ? 'math' : 'english';
      return Math.random() > 0.5 ? 'math' : 'english';
    }
    
    // Start a level
    function startLevel(index) {
      currentLevel = index;
      gameArea.style.display = "flex";
      levelContainer.style.display = "none";
      levelDisplay.innerText = currentLevel + 1;
      progressBar.style.width = `${((currentLevel) / TOTAL_LEVELS) * 100}%`;
      
      // Reset hint
      hintEl.style.display = 'none';
      hintBtn.innerText = `💡 Show Hint (${hintsLeft} left)`;
      hintBtn.disabled = hintsLeft <= 0;
      
      renderQuestion();
    }
    
    // Render the current question
    function renderQuestion() {
      let question;
      let subject;
      
      // Determine which question to show based on mode
      if (gameMode === 'math') {
        question = getMathQuestionForLevel(currentLevel);
        subject = 'math';
      } else if (gameMode === 'english') {
        question = getEnglishQuestionForLevel(currentLevel);
        subject = 'english';
      } else {
        subject = getSubjectForLevel(currentLevel);
        question = subject === 'math' 
          ? getMathQuestionForLevel(currentLevel)
          : getEnglishQuestionForLevel(currentLevel);
      }
      
      // Update UI
      questionEl.innerText = question.q;
      questionSubtitle.innerText = `Level ${currentLevel + 1} • ${subject === 'math' ? 'Math Challenge' : 'English Challenge'}`;
      hintEl.innerText = question.hint || "No hint available";
      
      // Update subject indicator
      const subjectIndicator = subject === 'math' 
        ? `<span class="subject-indicator math-subject">MATH</span>`
        : `<span class="subject-indicator english-subject">ENGLISH</span>`;
      
      answersEl.innerHTML = '';
      nextBtn.style.display = 'none';
      
      // Shuffle options
      const shuffledOptions = [...question.options].sort(() => Math.random() - 0.5);
      
      shuffledOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(btn, opt === question.correct);
        answersEl.appendChild(btn);
      });
      
      updateStats();
    }
    
    // Get appropriate math question for level
    function getMathQuestionForLevel(level) {
      // For levels beyond our predefined questions, generate random ones
      if (level < mathQuestions.length) {
        return mathQuestions[level];
      }
      
      // Generate harder questions for higher levels
      const difficulty = Math.min(15, Math.floor(level / 7) + 1);
      
      if (level < 70) {
        // Medium-hard math
        const a = Math.floor(Math.random() * 100) + 50;
        const b = Math.floor(Math.random() * 100) + 50;
        const operations = ['+', '-', '×', '÷'];
        const op = operations[Math.floor(Math.random() * 2)]; // Only + or - for these levels
        
        let question, correct;
        if (op === '+') {
          question = `${a} + ${b} = ?`;
          correct = a + b;
        } else {
          question = `${a + b} - ${b} = ?`;
          correct = a;
        }
        
        const options = generateOptions(correct, 10);
        return { q: question, options, correct, hint: `Calculate ${a} ${op} ${b}`, level: difficulty };
      } else {
        // Very hard math
        const types = ['algebra', 'exponents', 'roots', 'geometry'];
        const type = types[Math.floor(Math.random() * types.length)];
        
        let question, correct;
        if (type === 'algebra') {
          const x = Math.floor(Math.random() * 10) + 1;
          const a = Math.floor(Math.random() * 5) + 2;
          const b = Math.floor(Math.random() * 10) + 5;
          question = `If ${a}x + ${b} = ${a*x + b}, x = ?`;
          correct = x;
        } else if (type === 'exponents') {
          const base = Math.floor(Math.random() * 5) + 2;
          const exp = Math.floor(Math.random() * 4) + 2;
          question = `${base}⁰ + ${base}¹ + ${base}² = ?`;
          correct = 1 + base + (base * base);
        } else if (type === 'roots') {
          const num = [64, 81, 100, 144, 169][Math.floor(Math.random() * 5)];
          question = `√${num} = ?`;
          correct = Math.sqrt(num);
        } else {
          // geometry
          const r = Math.floor(Math.random() * 10) + 5;
          question = `Circle area with radius ${r} (π≈3.14) = ?`;
          correct = Math.round(3.14 * r * r);
        }
        
        const options = generateOptions(correct, 20);
        return { q: question, options, correct, hint: "Advanced math required", level: difficulty };
      }
    }
    
    // Get appropriate English question for level
    function getEnglishQuestionForLevel(level) {
      // For levels beyond our predefined questions, generate random ones
      if (level < englishQuestions.length) {
        return englishQuestions[level];
      }
      
      // Generate harder questions for higher levels
      const difficulty = Math.min(15, Math.floor(level / 7) + 1);
      
      // Advanced vocabulary
      const advancedWords = [
        { word: "serendipity", meaning: "fortunate chance discovery" },
        { word: "epiphany", meaning: "sudden realization" },
        { word: "melancholy", meaning: "sadness or depression" },
        { word: "paradox", meaning: "contradictory truth" },
        { word: "nostalgia", meaning: "longing for the past" },
        { word: "eloquent", meaning: "fluent and persuasive" },
        { word: "resilient", meaning: "able to recover quickly" },
        { word: "ambiguous", meaning: "unclear or having multiple meanings" },
        { word: "diligent", meaning: "hard-working" },
        { word: "meticulous", meaning: "very careful and precise" }
      ];
      
      const grammarQuestions = [
        { q: "Which is correct: 'Neither of them ___ happy.'", options: ["is", "are", "were"], correct: "is", hint: "'Neither' takes singular verb" },
        { q: "If I ___ you, I would study harder.", options: ["was", "were", "am"], correct: "were", hint: "Subjunctive mood" },
        { q: "She is the woman ___ I was telling you about.", options: ["who", "whom", "which"], correct: "whom", hint: "Object of the preposition" },
        { q: "The data ___ conclusive.", options: ["is", "are", "were"], correct: "are", hint: "Data is plural" },
        { q: "I wish I ___ there yesterday.", options: ["was", "were", "had been"], correct: "had been", hint: "Past perfect for past wishes" }
      ];
      
      const literaryTerms = [
        { q: "Exaggeration for effect:", options: ["simile", "hyperbole", "metonymy"], correct: "hyperbole", hint: "Overstatement" },
        { q: "Reference to famous person/event:", options: ["allusion", "illusion", "allegory"], correct: "allusion", hint: "Indirect reference" },
        { q: "Contradictory terms combined:", options: ["oxymoron", "paradox", "irony"], correct: "oxymoron", hint: "Like 'jumbo shrimp'" },
        { q: "Giving human traits to non-human:", options: ["metaphor", "personification", "simile"], correct: "personification", hint: "Making things human-like" },
        { q: "Story with moral lesson:", options: ["fable", "parable", "both"], correct: "both", hint: "Both teach lessons" }
      ];
      
      // Select question type based on level
      let questionPool;
      if (level < 70) {
        // Use advanced vocabulary
        const word = advancedWords[level % advancedWords.length];
        questionPool = [
          { 
            q: `What does '${word.word}' mean?`, 
            options: [word.meaning, "to speak loudly", "to run quickly", "to write beautifully"], 
            correct: word.meaning,
            hint: `Starts with '${word.meaning.charAt(0)}'`
          }
        ];
      } else {
        // Mix grammar and literary terms
        const pools = [grammarQuestions, literaryTerms];
        const selectedPool = pools[Math.floor(Math.random() * pools.length)];
        questionPool = selectedPool;
      }
      
      const question = questionPool[level % questionPool.length];
      return { ...question, level: difficulty };
    }
    
    // Generate wrong options
    function generateOptions(correct, range) {
      const options = [correct];
      while (options.length < 3) {
        const wrong = correct + (Math.floor(Math.random() * range * 2) - range);
        if (wrong !== correct && !options.includes(wrong) && wrong > 0) {
          options.push(wrong);
        }
      }
      return options.sort(() => Math.random() - 0.5);
    }
    
    // Check answer
    function checkAnswer(button, isCorrect) {
      // Disable all buttons after answer
      document.querySelectorAll('.answer-btn').forEach(btn => {
        btn.onclick = null;
        btn.style.pointerEvents = 'none';
      });
      
      if (isCorrect) {
        // Correct answer
        winSound.play();
        button.classList.add("correct");
        nextBtn.style.display = 'block';
        
        // Update score and streak
        const points = currentLevel < 50 ? 10 : 20;
        score += points;
        streak++;
        
        // Bonus for streak
        if (streak >= 5) {
          score += 50;
          showStreakBonus();
        }
        
        // Unlock next level if needed
        if (currentLevel + 1 === unlockedLevels && unlockedLevels < TOTAL_LEVELS) {
          unlockedLevels++;
          levelUpSound.play();
        }
        
        // Check if game is complete
        if (currentLevel + 1 === TOTAL_LEVELS) {
          setTimeout(showCompletionScreen, 1000);
        }
      } else {
        // Wrong answer
        wrongSound.play();
        button.classList.add("wrong");
        
        // Highlight correct answer
        document.querySelectorAll('.answer-btn').forEach(btn => {
          if (btn.innerText == getCurrentQuestion().correct) {
            btn.classList.add("correct");
          }
        });
        
        // Update lives and streak
        lives--;
        streak = 0;
        
        if (lives <= 0) {
          setTimeout(() => {
            alert(`Game Over, Praveen! Final Score: ${score}`);
            location.reload();
          }, 1000);
        }
        
        // Still show next button after delay
        setTimeout(() => {
          nextBtn.style.display = 'block';
        }, 1500);
      }
      
      updateStats();
    }
    
    // Get current question
    function getCurrentQuestion() {
      if (gameMode === 'math') {
        return getMathQuestionForLevel(currentLevel);
      } else if (gameMode === 'english') {
        return getEnglishQuestionForLevel(currentLevel);
      } else {
        const subject = getSubjectForLevel(currentLevel);
        return subject === 'math' 
          ? getMathQuestionForLevel(currentLevel)
          : getEnglishQuestionForLevel(currentLevel);
      }
    }
    
    // Show streak bonus
    function showStreakBonus() {
      const bonus = document.createElement('div');
      bonus.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: gold;
        color: black;
        padding: 20px;
        border-radius: 10px;
        font-size: 2rem;
        font-weight: bold;
        z-index: 1000;
        animation: fadeOut 2s forwards;
      `;
      bonus.innerText = `STREAK BONUS! +50`;
      document.body.appendChild(bonus);
      
      setTimeout(() => bonus.remove(), 2000);
    }
    
    // Show hint
    hintBtn.addEventListener('click', () => {
      if (hintsLeft > 0) {
        hintsLeft--;
        hintEl.style.display = 'block';
        hintBtn.innerText = `💡 Show Hint (${hintsLeft} left)`;
        hintBtn.disabled = hintsLeft <= 0;
      }
    });
    
    // Next level button
    nextBtn.onclick = () => {
      if (currentLevel + 1 < TOTAL_LEVELS) {
        startLevel(currentLevel + 1);
        createLevels();
      } else {
        showCompletionScreen();
      }
    };
    
    // Show completion screen
    function showCompletionScreen() {
      gameArea.style.display = "none";
      completionScreen.style.display = "block";
      finalScore.innerText = score;
      
      // Celebration effect
      celebration.style.display = "block";
      celebrationSound.play();
      
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.style.cssText = `
          position: absolute;
          width: 20px;
          height: 20px;
          background: ${['#0ff', '#ff0', '#f0f', '#0f0'][Math.floor(Math.random() * 4)]};
          top: -50px;
          left: ${Math.random() * 100}vw;
          border-radius: 50%;
          animation: fall ${Math.random() * 3 + 2}s linear forwards;
        `;
        confetti.innerText = ['🎉', '🎊', '🏆', '⭐'][Math.floor(Math.random() * 4)];
        celebration.appendChild(confetti);
        
        setTimeout(() => confetti.remove(), 5000);
      }
      
      // Add CSS for confetti animation
      if (!document.querySelector('#confetti-style')) {
        const style = document.createElement('style');
        style.id = 'confetti-style';
        style.textContent = `
          @keyframes fall {
            to { transform: translateY(100vh) rotate(${Math.random() * 360}deg); }
          }
        `;
        document.head.appendChild(style);
      }
    }
    
    // Update stats display
    function updateStats() {
      scoreEl.innerText = score;
      levelDisplay.innerText = currentLevel + 1;
      livesEl.innerText = lives;
      streakEl.innerText = streak;
      progressBar.style.width = `${((currentLevel + 1) / TOTAL_LEVELS) * 100}%`;
    }
    
    // Initialize the game
    initGame();
    
    // Add background monsters dynamically
    function addBackgroundMonsters() {
      const monsters = ['👾', '🧮', '📚', '🔤', '🔢', '🔣', '🧠', '⭐'];
      const container = document.body;
      
      for (let i = 0; i < 15; i++) {
        const monster = document.createElement('div');
        monster.className = 'bg-monster';
        monster.innerText = monsters[Math.floor(Math.random() * monsters.length)];
        monster.style.cssText = `
          top: ${Math.random() * 100}%;
          left: ${Math.random() * 100}%;
          font-size: ${Math.random() * 6 + 4}rem;
          animation-duration: ${Math.random() * 20 + 10}s;
          animation-delay: ${Math.random() * 5}s;
        `;
        container.appendChild(monster);
      }
    }
    
    addBackgroundMonsters();
  </script>
</body>
</html>
